server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

        # Mengizinkan upload dokumen PDF berukuran besar
    client_max_body_size 100M;

    # Root untuk katalog statis
    root /usr/share/nginx/html;
    index index.html;

    # Root -> tampilkan katalog (index.html), BUKAN diteruskan ke BentoPDF
    location = / {
        try_files /index.html =404;
        add_header Cache-Control no-store always;
    }

    # Akses langsung ke /index.html juga dilayani sebagai file statis
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control no-store always;
    }

    # Service worker BentoPDF: jangan di-cache browser
    location = /sw.js {
        proxy_pass http://bentopdf:8080;
        proxy_set_header Host $host;
        add_header Cache-Control no-store always;
    }

    location / {
        # Arahkan ke port 8080 internal BentoPDF
        proxy_pass http://bentopdf:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
