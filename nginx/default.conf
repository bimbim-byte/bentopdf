server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

        # Mengizinkan upload dokumen PDF berukuran besar
    client_max_body_size 100M;

    # Root untuk katalog statis
    root /usr/share/nginx/html;
    index index.html;

    # Root -> tampilkan katalog (index.html), BUKAN diteruskan ke BentoPDF
    location = / {
        try_files /index.html =404;
        add_header Cache-Control no-store always;
    }

        # Akses langsung ke /index.html juga dilayani sebagai file statis
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control no-store always;
    }

    # Alias diagnostik: URL baru yang belum pernah di-cache service worker
    location = /catalog {
        try_files /index.html =404;
        add_header Cache-Control no-store always;
    }

    # Sekali pakai: paksa browser membuang cache + service worker lama
    location = /reset {
        add_header Cache-Control no-store always;
        add_header Clear-Site-Data '"cache", "storage"' always;
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>Reset</title><p>Cache dan service worker dibersihkan. <a href="/">Buka katalog</a>.</p>';
    }

        # Service worker netral: menggantikan SW BentoPDF lama + hapus cache-nya
    location = /sw.js {
        try_files /sw.js =404;
        default_type application/javascript;
        add_header Cache-Control no-store always;
    }

    location / {
        # Arahkan ke port 8080 internal BentoPDF
        proxy_pass http://bentopdf:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
