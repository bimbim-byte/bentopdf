<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BentoPDF - PDF Tools</title>
<style>
  :root {
    --bg: #111827;
    --card: #1f2937;
    --border: #374151;
    --border-hover: #4f46e5;
    --accent: #818cf8;
    --text: #d1d5db;
    --text-dim: #9ca3af;
    --text-faint: #6b7280;
    --header-h: 9rem;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ---------- header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background-color: rgba(17, 24, 39, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }

  .bar {
    max-width: 80rem;
    margin: 0 auto;
    padding: 0.75rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .brand {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    letter-spacing: -0.01em;
  }
  .brand em { font-style: normal; color: var(--accent); }

  .search-wrap { position: relative; width: 100%; }
  .search-wrap .search-icon {
    position: absolute;
    left: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    width: 1.1rem;
    height: 1.1rem;
    color: var(--text-dim);
    pointer-events: none;
  }

  #search-bar {
    width: 100%;
    padding: 0.65rem 4.25rem 0.65rem 2.6rem;
    background-color: var(--card);
    color: #fff;
    border: 1px solid #4b5563;
    border-radius: 0.5rem;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #search-bar::placeholder { color: var(--text-dim); }
  #search-bar:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
  }

  kbd {
    position: absolute;
    right: 0.45rem;
    top: 50%;
    transform: translateY(-50%);
    background-color: #111827;
    border: 1px solid var(--border);
    border-radius: 0.375rem;
    padding: 0.2rem 0.45rem;
    font-family: inherit;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text);
  }

  /* ---------- category nav ---------- */
  .catnav {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding: 0 1rem 0.75rem;
    max-width: 80rem;
    margin: 0 auto;
    scrollbar-width: none;
  }
  .catnav::-webkit-scrollbar { display: none; }

  .catnav a {
    flex: none;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background-color: var(--card);
    color: var(--text-dim);
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s, background-color 0.15s;
  }
  .catnav a:hover { color: #fff; border-color: var(--border-hover); }
  .catnav a[aria-current="true"] {
    color: #fff;
    background-color: rgba(79, 70, 229, 0.22);
    border-color: #6366f1;
  }
  .catnav a:focus-visible,
  .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- content ---------- */
  .wrap { max-width: 80rem; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

  .status {
    margin: 0 0 1.5rem;
    font-size: 0.78rem;
    color: var(--text-faint);
  }

  .category { scroll-margin-top: calc(var(--header-h) + 0.75rem); }
  .category + .category { margin-top: 2.5rem; }

  .category h2 {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin: 0 0 1rem;
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
  }
  .category h2 .count {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--accent);
    background: rgba(79, 70, 229, 0.15);
    border: 1px solid rgba(129, 140, 248, 0.3);
    border-radius: 999px;
    padding: 0.1rem 0.5rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
  }

  .tool-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    text-decoration: none;
    color: inherit;
    background-color: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1rem;
    transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out, border-color 0.2s;
  }
  .tool-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-5px);
    box-shadow: 0 10px 15px -3px #0003, 0 4px 6px -2px #0000001a;
  }
  .tool-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .ic {
    width: 2rem;
    height: 2rem;
    margin-bottom: 0.7rem;
    color: var(--accent);
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }

  .tool-card h3 {
    margin: 0;
    font-size: 0.9rem;
    font-weight: 600;
    color: #fff;
    line-height: 1.3;
  }
  .tool-card p {
    margin: 0.3rem 0 0;
    font-size: 0.72rem;
    line-height: 1.4;
    color: var(--text-dim);
  }

  #no-results {
    text-align: center;
    color: var(--text-faint);
    padding: 4rem 1rem;
    font-size: 0.92rem;
  }
  #no-results strong { color: var(--text); }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (min-width: 768px) {
    .bar {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
    .search-wrap { max-width: 26rem; }
    .wrap { padding: 2rem 2rem 5rem; }
    .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.25rem; }
  }
  @media (min-width: 1024px) {
    .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1.5rem; }
  }
</style>
</head>

/* ---------- helpers ---------- */
function esc(v) {
  return String(v).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}

var headerEl = document.getElementById('topbar');
var navEl    = document.getElementById('catnav');
var statusEl = document.getElementById('status');
var sectionsEl = document.getElementById('sections');
var noResEl  = document.getElementById('no-results');
var noResTerm = document.getElementById('no-results-term');
var searchEl = document.getElementById('search-bar');
var hintEl   = document.getElementById('shortcut-hint');

/* ---------- build category nav ---------- */
navEl.innerHTML = CATS.map(function (cat) {
  return '<a href="#' + cat.id + '" data-cat="' + cat.id + '">' + esc(cat.name) + '</a>';
}).join('');

/* ---------- build category sections + tool cards ---------- */
var out = '';
CATS.forEach(function (cat) {
  var items = TOOLS.filter(function (t) { return t.c === cat.name; });
  out += '<section class="category" id="' + cat.id + '">' +
           '<h2>' + esc(cat.name) + '<span class="count">' + items.length + '</span></h2>' +
           '<div class="grid">';
  items.forEach(function (t) {
    var hay = (t.n + ' ' + t.d + ' ' + t.c).toLowerCase();
    out += '<a class="tool-card" href="' + BASE + esc(t.s) + '" data-hay="' + esc(hay) + '">' +
             '<svg class="ic" aria-hidden="true"><use href="#i-' + esc(t.i) + '"/></svg>' +
             '<h3>' + esc(t.n) + '</h3>' +
             '<p>' + esc(t.d) + '</p>' +
           '</a>';
  });
  out += '</div></section>';
});
sectionsEl.innerHTML = out;

var cards    = Array.prototype.slice.call(document.querySelectorAll('.tool-card'));
var sections = Array.prototype.slice.call(document.querySelectorAll('.category'));
var navLinks = Array.prototype.slice.call(navEl.querySelectorAll('a'));
var TOTAL    = TOOLS.length;

/* ---------- search / filter ---------- */
function applyFilter(raw) {
  var q = raw.trim().toLowerCase();
  var shown = 0;

  cards.forEach(function (card) {
    var match = !q || card.dataset.hay.indexOf(q) !== -1;
    card.hidden = !match;
    if (match) shown++;
  });

  sections.forEach(function (sec) {
    sec.hidden = !sec.querySelector('.tool-card:not([hidden])');
  });

  if (!q) {
    statusEl.textContent = TOTAL + ' tools in ' + CATS.length + ' categories';
    noResEl.hidden = true;
  } else {
    statusEl.textContent = 'Showing ' + shown + ' of ' + TOTAL + ' tools';
    noResEl.hidden = shown !== 0;
    if (shown === 0) noResTerm.textContent = '"' + raw.trim() + '"';
  }
  updateActive();
}

searchEl.addEventListener('input', function () { applyFilter(searchEl.value); });

/* ---------- scroll spy ---------- */
function updateActive() {
  var offset = headerEl.offsetHeight + 24;
  var current = null;
  sections.forEach(function (sec) {
    if (!sec.hidden && sec.getBoundingClientRect().top <= offset) current = sec;
  });
  navLinks.forEach(function (a) {
    a.setAttribute('aria-current', current && a.dataset.cat === current.id ? 'true' : 'false');
  });
}

var ticking = false;
window.addEventListener('scroll', function () {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(function () { ticking = false; updateActive(); });
}, { passive: true });

/* ---------- header height -> scroll offset ---------- */
function syncHeaderHeight() {
  document.documentElement.style.setProperty('--header-h', headerEl.offsetHeight + 'px');
  updateActive();
}
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('load', syncHeaderHeight);
syncHeaderHeight();

/* ---------- nav click: mark active immediately ---------- */
navLinks.forEach(function (a) {
  a.addEventListener('click', function () {
    navLinks.forEach(function (b) { b.setAttribute('aria-current', 'false'); });
    a.setAttribute('aria-current', 'true');
  });
});

/* ---------- keyboard shortcuts ---------- */
if (/Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent)) {
  hintEl.textContent = '\u2318 K';
}

document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    searchEl.focus();
    searchEl.select();
    return;
  }
  if (e.key === '/' && document.activeElement !== searchEl) {
    e.preventDefault();
    searchEl.focus();
    return;
  }
  if (e.key === 'Escape' && document.activeElement === searchEl) {
    searchEl.value = '';
    applyFilter('');
    searchEl.blur();
  }
});

/* ---------- bersihkan service worker & cache BentoPDF lama ---------- */
/* SW lama ber-scope "/" bisa mencegat root dan menyajikan app shell dari
   cache, sehingga katalog tidak pernah tampil. Ini melepasnya sekali. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    regs.forEach(function (r) {
      var url = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) || '';
      if (url.indexOf('sw.js') !== -1) { r.unregister(); }
    });
  }).catch(function () {});
}
if (window.caches && caches.keys) {
  caches.keys().then(function (keys) {
    keys.forEach(function (k) { caches.delete(k); });
  }).catch(function () {});
}

/* ---------- init ---------- */
applyFilter('');
</script>
